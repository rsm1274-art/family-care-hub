    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
    <!-- Versioned filenames, kept in lockstep with manifest.json -- see the
         _comment_icons note there for why overwriting artwork in place leaves
         installed apps showing the old icon forever. apple-touch-icon is what
         iOS reads at add-to-home-screen time, so it moves with the rest. -->
    <link rel="icon" type="image/png" href="/icon-192-v2.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/icon-512-v2.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/icon-192-v2.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
