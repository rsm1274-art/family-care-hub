<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Family Care Hub</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
    <!-- Versioned filenames, kept in lockstep with manifest.json -- see the
         _comment_icons note there for why overwriting artwork in place leaves
         installed apps showing the old icon forever. apple-touch-icon is what
         iOS reads at add-to-home-screen time, so it moves with the rest. -->
    <link rel="icon" type="image/png" href="/icon-192-v2.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/icon-512-v2.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/icon-192-v2.png" />
    <link rel="manifest" href="/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Product Sans is Google's proprietary corporate typeface. It is not on
         Google Fonts and is not licensed for third-party embedding, so there is
         no font file to ship -- and fetching one would breach the no-network
         rule this app is built on. Naming it first means it renders for anyone
         who has it installed locally; everyone else falls through to the
         geometric-leaning stack below, which is what the app already looked
         like. Swap in a vendored OFL face (Jost is the closest open match) if a
         guaranteed identical rendering is needed.

         Family only -- no sizes here. Every size stays in rem via Tailwind's
         scale, so the .large-text 115% toggle keeps working. */
      :root {
        --font-app: 'Product Sans', 'Google Sans', 'Google Sans Text',
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
      }

      html,
      body {
        font-family: var(--font-app);
      }

      /* Form controls do not inherit the document font by default. */
      input,
      select,
      textarea,
      button {
        font-family: inherit;
      }

      :root {
        --color-primary: #0f172a; /* Slate 900 */
        --color-surface: #1e293b; /* Slate 800 */
        --color-surface-hover: #334155; /* Slate 700 */
        --color-accent: #0ea5e9; /* Sky 500 */
        --color-text-main: #f8fafc; /* Slate 50 */
        --color-text-muted: #94a3b8; /* Slate 400 */
        --color-border: #334155; /* Slate 700 */
      }

      .light-mode {
        --color-primary: #f1f5f9; /* Slate 100 */
        --color-surface: #ffffff; /* White */
        --color-surface-hover: #e2e8f0; /* Slate 200 */
        --color-accent: #0284c7; /* Sky 600 (Darker for contrast) */
        --color-text-main: #0f172a; /* Slate 900 */
        --color-text-muted: #64748b; /* Slate 500 */
        --color-border: #cbd5e1; /* Slate 300 */
      }
      
      .high-contrast {
        filter: contrast(125%);
      }
      
      .large-text {
        font-size: 115%;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            // Also set here so Tailwind's preflight and the font-sans utility
            // agree with the html/body rule above, whichever stylesheet the CDN
            // ends up injecting last.
            fontFamily: {
              sans: [
                'Product Sans', 'Google Sans', 'Google Sans Text',
                'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI',
                'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif',
              ],
            },
            colors: {
              primary: 'var(--color-primary)',
              surface: 'var(--color-surface)',
              'surface-hover': 'var(--color-surface-hover)',
              accent: 'var(--color-accent)',
              mainText: 'var(--color-text-main)',
              mutedText: 'var(--color-text-muted)',
              borderColor: 'var(--color-border)',
              danger: '#ef4444',
              success: '#10b981',
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
